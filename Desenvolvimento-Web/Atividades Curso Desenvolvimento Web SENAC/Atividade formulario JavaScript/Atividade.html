<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulário de contato</title>
	<link rel="stylesheet" href="Atividade.css">
</head>
<body>
	<main class="container">
		<section class="formulario-box" aria-labelledby="titulo-formulario">
			<p class="identificacao">Atividade JavaScript</p>
			<h1 id="titulo-formulario">Entre em contato</h1>
			<p class="introducao">Preencha os campos abaixo. Os dados serão validados antes do envio.</p>

			<form id="formulario" novalidate>
				<div class="campo">
					<label for="nome">Nome completo</label>
					<input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name">
					<small class="mensagem-erro" id="erro-nome"></small>
				</div>
				<div class="campo">
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" placeholder="exemplo@email.com" autocomplete="email">
					<small class="mensagem-erro" id="erro-email"></small>
				</div>
				<div class="linha-campos">
					<div class="campo">
						<label for="telefone">Telefone</label>
						<input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel">
						<small class="mensagem-erro" id="erro-telefone"></small>
					</div>
					<div class="campo">
						<label for="idade">Idade</label>
						<input type="number" id="idade" name="idade" min="1" max="120" placeholder="Sua idade">
						<small class="mensagem-erro" id="erro-idade"></small>
					</div>
				</div>
				<div class="campo">
					<label for="mensagem">Mensagem</label>
					<textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sua mensagem"></textarea>
					<small class="mensagem-erro" id="erro-mensagem"></small>
				</div>
				<button type="submit">Enviar formulário</button>
				<p id="resultado" class="resultado" role="status" aria-live="polite"></p>
			</form>
		</section>
	</main>
	<script src="Atividade.js"></script>
</body>
</html>
