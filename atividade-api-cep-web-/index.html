<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Consulta de Endereços</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Cadastro de Endereço</h1>

            <form id="formEndereco">
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input 
                        type="text" 
                        id="cep" 
                        placeholder="Digite o CEP"
                        maxlength="9"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="logradouro">Rua</label>
                    <input 
                        type="text" 
                        id="logradouro"
                        autocomplete="street-address"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input 
                            type="text" 
                            id="numero"
                            autocomplete="address-line2"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input 
                            type="text" 
                            id="bairro"
                            autocomplete="address-level3"
                            required
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input 
                            type="text" 
                            id="cidade"
                            autocomplete="address-level2"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" autocomplete="address-level1" required>
                            <option value="">Selecione o estado</option>
                            <option>AC</option>
                            <option>AL</option>
                            <option>AP</option>
                            <option>AM</option>
                            <option>BA</option>
                            <option>CE</option>
                            <option>DF</option>
                            <option>ES</option>
                            <option>GO</option>
                            <option>MA</option>
                            <option>MT</option>
                            <option>MS</option>
                            <option>MG</option>
                            <option>PA</option>
                            <option>PB</option>
                            <option>PR</option>
                            <option>PE</option>
                            <option>PI</option>
                            <option>RJ</option>
                            <option>RN</option>
                            <option>RS</option>
                            <option>RO</option>
                            <option>RR</option>
                            <option>SC</option>
                            <option>SP</option>
                            <option>SE</option>
                            <option>TO</option>
                        </select>
                    </div>
                </div>

                <div class="botoes-container">
                    <button 
                        type="button" 
                        id="btnBuscar"
                    >
                        Buscar CEP
                    </button>
                    <button 
                        type="button" 
                        id="btnSalvar"
                        class="btn-secundario"
                    >
                        Salvar Endereço
                    </button>
                </div>

                <p id="mensagem" aria-live="polite" tabindex="-1"></p>
            </form>
        </div>

        <div class="card card-historico">
            <div class="historico-header">
                <h2>Endereços Cadastrados</h2>
                <span id="contadorEnderecos" class="contador-badge">0 registros</span>
            </div>

            <div class="busca-container">
                <input 
                    type="text" 
                    id="buscaCadastrados" 
                    placeholder="Consultar por CEP, rua ou cidade..."
                    aria-label="Consultar endereços cadastrados"
                >
                <button type="button" id="btnLimparBusca" class="btn-limpar">Limpar</button>
            </div>

            <div id="listaEnderecos" class="lista-enderecos" aria-live="polite" aria-busy="false"></div>
        </div>
    </div>

    <script src="js/models/EnderecoModel.js"></script>
    <script src="js/views/EnderecoView.js"></script>
    <script src="js/controllers/EnderecoController.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
