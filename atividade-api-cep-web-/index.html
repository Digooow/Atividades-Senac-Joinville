<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Consulta de Endereços</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Cadastro de Endereço</h1>

            <form onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input 
                        type="text" 
                        id="cep" 
                        placeholder="Digite o CEP"
                        maxlength="9"
                    >
                </div>

                <div class="form-group">
                    <label for="logradouro">Rua</label>
                    <input 
                        type="text" 
                        id="logradouro"
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input 
                            type="text" 
                            id="numero"
                        >
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input 
                            type="text" 
                            id="bairro"
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input 
                            type="text" 
                            id="cidade"
                        >
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <input 
                            type="text" 
                            id="estado"
                        >
                    </div>
                </div>

                <div class="botoes-container">
                    <button 
                        type="button" 
                        id="btnBuscar"
                        onclick="buscarCep()"
                    >
                        Buscar CEP
                    </button>
                    <button 
                        type="button" 
                        id="btnSalvar"
                        class="btn-secundario"
                    >
                        Salvar Endereço
                    </button>
                </div>

                <p id="mensagem"></p>
            </form>
        </div>

        <div class="card card-historico">
            <div class="historico-header">
                <h2>Endereços Cadastrados</h2>
                <span id="contadorEnderecos" class="contador-badge">0 registros</span>
            </div>

            <div class="busca-container">
                <input 
                    type="text" 
                    id="buscaCadastrados" 
                    placeholder="Consultar por CEP, rua ou cidade..."
                >
                <button type="button" id="btnLimparBusca" class="btn-limpar">Limpar</button>
            </div>

            <div id="listaEnderecos" class="lista-enderecos"></div>
        </div>
    </div>

    <script src="js/models/EnderecoModel.js"></script>
    <script src="js/views/EnderecoView.js"></script>
    <script src="js/controllers/EnderecoController.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
