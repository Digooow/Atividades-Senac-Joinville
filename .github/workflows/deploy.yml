name: Deploy Portfolio to Cloudflare Pages with DevOps Quality Gates

on:
  push:
    branches: ["main"]
    paths:
      - "devops-agile-develop-ia/Digooow.github.io/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "cloudflare-pages-portfolio"
  cancel-in-progress: false

env:
  PORTFOLIO_DIR: "devops-agile-develop-ia/Digooow.github.io"
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT_NAME || 'digooow-portfolio' }}

jobs:
  # Job 1: Validação de Qualidade de Código (Linting & Syntax Checks)
  quality-gate:
    name: Code Quality & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Install HTML validator
        run: npm install --global --ignore-scripts html-validate@10.17.0

      - name: HTML & JavaScript Syntax Check
        run: |
          html-validate "${{ env.PORTFOLIO_DIR }}/*.html"
          for file in "${{ env.PORTFOLIO_DIR }}"/assets/js/*.js; do
            node --check "$file"
          done

  # Job 2: Build, Empacotamento e Implantação no Cloudflare Pages
  deploy:
    name: Build & Deploy to Cloudflare Pages
    needs: quality-gate
    outputs:
      page_url: ${{ steps.cloudflare_pages.outputs.deployment-url }}
    environment:
      name: cloudflare-pages
      url: ${{ steps.cloudflare_pages.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - name: Verify Cloudflare Credentials & Ensure Pages Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const apiToken = process.env.CLOUDFLARE_API_TOKEN;
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
            const project = process.env.CF_PAGES_PROJECT;

            if (!apiToken || !accountId) {
              console.error("Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub repository secrets.");
              process.exit(1);
            }
            if (!/^[a-z0-9][a-z0-9-]{0,57}$/.test(project)) {
              console.error(`Invalid CF_PAGES_PROJECT name: ${project}`);
              process.exit(1);
            }

            const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/pages/projects`;
            const headers = {
              Authorization: `Bearer ${apiToken}`,
              "Content-Type": "application/json",
            };

            (async () => {
              const check = await fetch(`${base}/${encodeURIComponent(project)}`, {
                headers,
                signal: AbortSignal.timeout(15000),
              });
              if (check.ok) {
                console.log(`Cloudflare Pages project "${project}" found.`);
                return;
              }
              if (check.status !== 404) {
                const body = await check.text();
                console.error(`Failed to verify Cloudflare Pages project (HTTP ${check.status}): ${body}`);
                process.exit(1);
              }

              console.log(`Creating Cloudflare Pages project "${project}"...`);
              const create = await fetch(base, {
                method: "POST",
                headers,
                body: JSON.stringify({ name: project, production_branch: "main" }),
                signal: AbortSignal.timeout(15000),
              });
              if (!create.ok) {
                const body = await create.text();
                console.error(`Failed to create Cloudflare Pages project (HTTP ${create.status}): ${body}`);
                process.exit(1);
              }
              console.log(`Cloudflare Pages project "${project}" created.`);
            })().catch((err) => {
              console.error("Cloudflare API check failed:", err.message);
              process.exit(1);
            });
          '

      - name: Prepare Clean Static Bundle
        run: |
          BUNDLE_DIR="${{ runner.temp }}/pages-dist"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          cp "${{ env.PORTFOLIO_DIR }}/index.html" "$BUNDLE_DIR/index.html"
          if [ -f "${{ env.PORTFOLIO_DIR }}/robots.txt" ]; then
            cp "${{ env.PORTFOLIO_DIR }}/robots.txt" "$BUNDLE_DIR/robots.txt"
          fi
          cp -R "${{ env.PORTFOLIO_DIR }}/assets" "$BUNDLE_DIR/assets"

      - name: Deploy to Cloudflare Pages
        id: cloudflare_pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy "${{ runner.temp }}/pages-dist" --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

  # Job 3: Auditoria Automatizada Pós-Deploy (Lighthouse CI)
  lighthouse-audit:
    name: Performance & Accessibility Audit
    needs: deploy
    if: ${{ needs.deploy.outputs.page_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Cloudflare Pages Edge Propagation
        env:
          TARGET_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          max_attempts=36
          for i in $(seq 1 "$max_attempts"); do
            if curl -fsS --max-time 10 -o /dev/null "$TARGET_URL" 2>/dev/null; then
              echo "Deployment live at $TARGET_URL (attempt $i/$max_attempts)"
              exit 0
            fi
            echo "Waiting for TLS & edge propagation (attempt $i/$max_attempts)..."
            sleep 5
          done
          echo "Final diagnostic check against $TARGET_URL:"
          curl -v --max-time 10 -o /dev/null "$TARGET_URL" || true
          echo "Timed out waiting for $TARGET_URL"
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            ${{ needs.deploy.outputs.page_url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
